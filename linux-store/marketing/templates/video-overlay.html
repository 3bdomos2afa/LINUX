<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- kit:inject -->
<title>LINUX · Story video overlay · Welcome code</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root{--w:1080px;--h:1920px}
  /* Rendered per layer on black, on white (→ exact alpha) and as a white "frost" mask; render.mjs
     animates the layers over the embroidery footage. Without a matte it previews on a still. */
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:276px var(--pad) 356px;background:#043020 center/cover no-repeat}
  html[data-matte] .stage{background:none}
  html[data-matte="black"],html[data-matte="black"] body,html[data-matte="mask"],html[data-matte="mask"] body{background:#000}
  html[data-matte="white"],html[data-matte="white"] body{background:#fff}
  html[data-matte] .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
  html[data-layer] .stage [data-layer]:not(.is-active){visibility:hidden}
  html[data-matte="mask"] .stage *{visibility:hidden!important}
  html[data-matte="mask"] .stage .frost.is-active,html[data-matte="mask"] .stage .is-active .frost{visibility:visible!important;background:#fff!important;box-shadow:none!important}
  html[data-matte="mask"] .stage .frost *{visibility:hidden!important}
  html[data-matte="mask"] .frost::before,html[data-matte="mask"] .frost::after{display:none}

  .scrim{position:absolute;inset:0;z-index:-1;background:
    linear-gradient(180deg,rgba(2,26,18,.8) 0%,rgba(2,26,18,.3) 19%,rgba(2,26,18,0) 34%,rgba(2,26,18,0) 56%,rgba(2,26,18,.5) 76%,rgba(2,26,18,.86) 100%)}
  .wordmark{height:52px}
  .eyebrow{margin-top:30px;font-size:34px;padding:16px 32px 17px}
  .coupon{position:relative;align-self:stretch;margin:auto 0;display:flex;flex-direction:column}
  .coupon__top,.coupon__bottom{display:flex;flex-direction:column;align-items:center}
  .coupon__top{border-radius:72px 72px 0 0;padding:54px 50px 46px;
    -webkit-mask:radial-gradient(circle 34px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;
    mask:radial-gradient(circle 34px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
  .coupon__bottom{border-radius:0 0 72px 72px;padding:44px 50px 52px;
    -webkit-mask:radial-gradient(circle 34px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;
    mask:radial-gradient(circle 34px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
  .perf{position:absolute;left:58px;right:58px;top:-1.5px;border-top:3px dashed rgba(255,255,255,.42)}
  .headline{font-size:128px;line-height:1}
  html[lang="ar"] .headline{line-height:1.18}
  .label{font-size:34px;line-height:1.2;color:rgba(255,255,255,.85)}
  .code{margin-top:20px;align-self:stretch;display:flex;align-items:center;justify-content:center;gap:26px;padding:22px 48px 26px}
  .code__txt{font-size:112px;line-height:1.08;letter-spacing:.06em;color:var(--cream);white-space:nowrap;min-width:0}
  .code .i{font-size:50px;color:var(--lime)}
  .chip{margin-top:0;font-size:30px;padding:16px 28px 17px}
  .cta{margin-top:34px;font-size:40px;padding:30px 58px 31px}
</style>
</head>
<body>
<main class="stage" data-bg="images.video_preview">
  <div class="scrim abs" data-layer="scrim"></div>
  <img class="wordmark audit" data-layer="top" src="../../theme/assets/wordmark.svg" alt="LINUX">
  <span class="glass pill eyebrow ui frost" data-layer="top" data-k="eyebrow"></span>
  <section class="coupon" data-layer="panel">
    <div class="coupon__top glass glass--smoke frost">
      <h1 class="h headline" data-k="headline" data-fit="2"></h1>
    </div>
    <div class="coupon__bottom glass glass--smoke frost">
      <i class="perf abs"></i>
      <p class="ui label" data-k="code_label"></p>
      <div class="code codebox"><span class="h code__txt ltr" data-k="code" data-fit="1"></span><svg data-icon="copy"></svg></div>
    </div>
  </section>
  <span class="glass glass--smoke pill chip ui frost" data-layer="chip"><svg data-icon="truck"></svg><span data-k="chip"></span></span>
  <span class="cta audit" data-layer="cta"><span data-k="cta"></span><svg class="flip" data-icon="arrow"></svg></span>
</main>
<script src="kit.js"></script>
</body>
</html>
