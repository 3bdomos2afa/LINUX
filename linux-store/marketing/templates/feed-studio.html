<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- kit:inject -->
<title>LINUX · Feed 4:5 · Design your own</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root{--w:1080px;--h:1350px}
  .stage{display:flex;flex-direction:column;padding:52px var(--pad) 56px}
  .glow{position:absolute;z-index:-2;width:980px;height:980px;left:50%;top:760px;margin:-490px 0 0 -490px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(143,203,90,.42),rgba(143,203,90,.14) 55%,rgba(143,203,90,0))}
  .headline{margin-top:34px;font-size:104px}
  .body{margin-top:18px;max-width:900px;font-size:33px;line-height:1.36;color:rgba(255,255,255,.84)}
  html[lang="en"] .body{font-size:30px;line-height:1.3}
  .visual{position:relative;flex:1;min-height:0;margin-top:6px}
  .garment{position:absolute;inset:0;display:grid;place-items:center}
  .garment__box{position:relative;height:100%;aspect-ratio:1}
  .hoodie{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 40px 46px rgba(0,0,0,.5))}
  /* No transform here: the artwork multiplies onto the hoodie, which needs a shared stacking context. */
  .design{position:absolute;left:50%;top:40%;width:31%;aspect-ratio:.96;margin:-16.1% 0 0 -15.5%;
    outline:3px dashed rgba(143,203,90,.95);outline-offset:16px;border-radius:8px}
  .design img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
  .design i{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--lime);box-shadow:0 4px 10px rgba(0,0,0,.35)}
  .design i:nth-of-type(1){left:-28px;top:-28px}
  .design i:nth-of-type(2){right:-28px;top:-28px}
  .design i:nth-of-type(3){left:-28px;bottom:-28px}
  .design i:nth-of-type(4){right:-28px;bottom:-28px}
  .design__tag{position:absolute;bottom:calc(100% + 34px);left:50%;transform:translateX(-50%);padding:10px 22px 11px;border-radius:999px;
    background:var(--lime);color:var(--ink);font-size:24px;font-weight:var(--strong-w);white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
  .swatches{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;padding:22px 18px}
  .swatches i{width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:inset 0 2px 3px rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.35)}
  .swatches i.on{box-shadow:inset 0 2px 3px rgba(255,255,255,.35),0 0 0 4px #0b3a28,0 0 0 7px var(--lime)}
  .mascot{position:absolute;z-index:3;inset-inline-end:-24px;bottom:-54px;height:300px;width:auto;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45))}
  .seg{z-index:2;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;--r:54px}
  .seg__opt{display:flex;align-items:center;gap:20px;padding:20px 24px;border-radius:42px;min-width:0}
  .seg__opt.is-on{background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.12));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 10px 24px -10px rgba(0,0,0,.45)}
  .seg__ic{flex:none;display:grid;place-items:center;width:70px;height:70px;border-radius:50%;background:rgba(2,26,18,.45);color:var(--lime);font-size:34px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
  .seg__opt.is-on .seg__ic{background:var(--lime);color:var(--ink)}
  .seg__txt{display:flex;flex-direction:column;gap:4px;min-width:0}
  .seg__txt b{font-size:36px;line-height:1.12;color:var(--cream)}
  .seg__txt span{font-size:25px;line-height:1.25;color:rgba(255,255,255,.82)}
  .bottom{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:24px}
</style>
</head>
<body>
<main class="stage">
  <div class="atmo"></div><div class="glow"></div><div class="grain"></div>
  <header class="top">
    <img class="wordmark audit" src="../../theme/assets/wordmark.svg" alt="LINUX">
    <span class="glass pill eyebrow ui"><svg data-icon="sparkle"></svg><span data-k="eyebrow"></span></span>
  </header>
  <h1 class="h headline" data-k="headline" data-fit="2"></h1>
  <p class="body ui" data-k="body" data-fit="2"></p>
  <div class="visual">
    <div class="garment"><div class="garment__box">
      <img class="hoodie" data-src="images.studio_hoodie" alt="">
      <div class="design"><img data-src="images.studio_design" alt=""><i></i><i></i><i></i><i></i><span class="design__tag ui" data-k="design_tag"></span></div>
    </div></div>
    <div class="swatches glass pill" aria-hidden="true"><i class="on" style="--c:#d8c4a2"></i><i style="--c:#1d1d1f"></i><i style="--c:#7b1e2c"></i><i style="--c:#f4f2ee"></i></div>
    <img class="mascot" data-src="images.studio_mascot" alt="">
  </div>
  <div class="seg glass">
    <div class="seg__opt is-on"><span class="seg__ic"><svg data-icon="print"></svg></span><span class="seg__txt"><b class="ui" data-k="print_title"></b><span class="ui" data-k="print_note"></span></span></div>
    <div class="seg__opt"><span class="seg__ic"><svg data-icon="needle"></svg></span><span class="seg__txt"><b class="ui" data-k="embroidery_title"></b><span class="ui" data-k="embroidery_note"></span></span></div>
  </div>
  <footer class="bottom">
    <span class="cta audit"><span data-k="cta"></span><svg class="flip" data-icon="arrow"></svg></span>
    <span class="glass pill site ui ltr" data-k="site"></span>
  </footer>
</main>
<script src="kit.js"></script>
</body>
</html>
