<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- kit:inject -->
<title>LINUX · Square 1:1 · Carousel cover</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root{--w:1080px;--h:1080px}
  .stage{display:flex;flex-direction:column;padding:52px var(--pad) 52px}
  .headline{margin-top:34px;font-size:100px}
  .fan{position:relative;flex:1;margin-top:8px}
  .card{position:absolute;left:50%;top:50%;width:330px;height:440px;margin:-220px 0 0 -165px;border-radius:44px;overflow:hidden;
    background:radial-gradient(90% 70% at 50% 28%,#f8eee0,#e6d3b8);box-shadow:0 40px 70px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.12)}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 0 0 1.5px rgba(255,255,255,.3)}
  .card img{position:absolute;left:50%;top:-18px;height:640px;width:auto;margin-left:-174px;mix-blend-mode:multiply}
  .card:nth-child(1){transform:translate(-242px,34px) rotate(-10deg)}
  .card:nth-child(2){z-index:2;transform:translateY(-6px) scale(1.07)}
  .card:nth-child(3){transform:translate(242px,34px) rotate(10deg)}
  .bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:8px}
  .swipe{display:inline-flex;align-items:center;gap:18px;padding:15px 24px 16px 28px;font-size:28px;line-height:1.1;white-space:nowrap}
  html[dir="rtl"] .swipe{padding:15px 28px 16px 24px}
  .swipe .i{color:var(--lime)}
  .dots{display:flex;gap:8px;direction:ltr}
  .dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.45)}
  .dots i.on{width:30px;border-radius:999px;background:var(--lime)}
</style>
</head>
<body>
<main class="stage">
  <div class="atmo"></div><div class="grain"></div>
  <header class="top">
    <img class="wordmark audit" src="../../theme/assets/wordmark.svg" alt="LINUX">
    <span class="glass pill eyebrow ui" data-k="eyebrow"></span>
  </header>
  <h1 class="h headline" data-k="headline" data-fit="2"></h1>
  <div class="fan" data-list="images.cover_photos"><figure class="card" data-item><img data-f-src="." alt=""></figure></div>
  <footer class="bottom">
    <span class="glass pill chip ui"><svg data-icon="needle"></svg><span data-k="chip"></span></span>
    <span class="glass pill swipe ui"><span data-k="swipe"></span><span class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></span><svg class="flip" data-icon="chev"></svg></span>
  </footer>
</main>
<script src="kit.js"></script>
</body>
</html>
