<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- kit:inject -->
<title>LINUX · Story 9:16 · Welcome code</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root{--w:1080px;--h:1920px}
  /* Content lives between the story safe lines: 250px from the top, 340px from the bottom. */
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:272px var(--pad) 356px}
  .bg{position:absolute;inset:0;z-index:-3;background:#043020 center/cover no-repeat;transform:scale(1.03)}
  .scrim{position:absolute;inset:0;z-index:-2;background:
    linear-gradient(180deg,rgba(2,26,18,.84) 0%,rgba(2,26,18,.4) 20%,rgba(2,26,18,.12) 38%,rgba(2,26,18,.22) 62%,rgba(2,26,18,.9) 100%)}
  .wordmark{height:50px}
  .coupon{position:relative;align-self:stretch;margin:auto 0;display:flex;flex-direction:column}
  .coupon__top,.coupon__bottom{display:flex;flex-direction:column;align-items:center;--blur:20px}
  /* Ticket notches: each half is masked with two half-width layers that cut a circle at the seam. */
  .coupon__top{border-radius:72px 72px 0 0;padding:60px 56px 50px;
    -webkit-mask:radial-gradient(circle 34px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;
    mask:radial-gradient(circle 34px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
  .coupon__bottom{border-radius:0 0 72px 72px;padding:48px 56px 56px;
    -webkit-mask:radial-gradient(circle 34px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;
    mask:radial-gradient(circle 34px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 34px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
  .perf{position:absolute;left:58px;right:58px;top:-1.5px;border-top:3px dashed rgba(255,255,255,.42)}
  .eyebrow{font-size:34px;padding:16px 32px 17px}
  .headline{margin-top:26px;font-size:200px;line-height:1;white-space:nowrap}
  html[lang="ar"] .headline{line-height:1.12}
  .subhead{margin-top:6px;font-size:70px;line-height:1.15;color:#fff;white-space:nowrap}
  html[lang="en"] .subhead{font-family:var(--head)}
  .label{font-size:34px;line-height:1.2;color:rgba(255,255,255,.82)}
  .code{margin-top:22px;align-self:stretch;display:flex;align-items:center;justify-content:center;gap:26px;padding:24px 48px 28px}
  .code__txt{font-size:118px;line-height:1.08;letter-spacing:.06em;color:var(--cream);white-space:nowrap;min-width:0}
  .code .i{font-size:52px;color:var(--lime)}
  .hint{margin-top:24px;font-size:30px;line-height:1.3;color:rgba(255,255,255,.74)}
  /* Behind the ticket (z-index -1): the glass frosts the penguin's body while his head pops out. */
  .mascot{position:absolute;z-index:-1;bottom:calc(100% - 132px);inset-inline-end:26px;height:292px;width:auto;filter:drop-shadow(0 20px 26px rgba(0,0,0,.45))}
  .cta{font-size:40px;padding:30px 58px 31px}
</style>
</head>
<body>
<main class="stage">
  <div class="bg" data-bg="images.code_background"></div><div class="scrim"></div><div class="grain"></div>
  <img class="wordmark audit" src="../../theme/assets/wordmark.svg" alt="LINUX">
  <section class="coupon">
    <div class="coupon__top glass glass--smoke">
      <span class="glass glass--clear pill eyebrow ui" data-k="eyebrow"></span>
      <h1 class="h headline" data-k="headline" data-fit="1"></h1>
      <p class="ui subhead" data-k="subhead" data-fit="1"></p>
    </div>
    <div class="coupon__bottom glass glass--smoke">
      <i class="perf abs"></i>
      <p class="ui label" data-k="code_label"></p>
      <div class="code codebox"><span class="h code__txt ltr" data-k="code" data-fit="1"></span><svg data-icon="copy"></svg></div>
      <p class="ui hint" data-k="hint"></p>
    </div>
    <img class="mascot audit" data-src="images.code_mascot" alt="">
  </section>
  <span class="cta audit"><span data-k="cta"></span><svg class="flip" data-icon="arrow"></svg></span>
</main>
<script src="kit.js"></script>
</body>
</html>
