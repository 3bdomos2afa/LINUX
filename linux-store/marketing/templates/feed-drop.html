<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- kit:inject -->
<title>LINUX · Feed 4:5 · New drop</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root{--w:1080px;--h:1350px}
  .stage{display:flex;flex-direction:column;padding:52px var(--pad) 56px}
  .card{position:relative;flex:none;height:840px;margin-top:28px;border-radius:64px;overflow:hidden;
    background:radial-gradient(90% 70% at 50% 28%,#f8eee0 0%,#eedfc9 68%,#e2cdb0 100%);
    box-shadow:0 60px 110px -50px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.1)}
  .card::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 0 0 1.5px rgba(255,255,255,.28),inset 0 -140px 120px -70px rgba(2,26,18,.4)}
  /* White studio backdrop turns into the card's cream via multiply; side fades hide the photo edges. */
  .card__img{position:absolute;left:50%;top:-64px;height:1560px;width:auto;transform:translateX(-50%);mix-blend-mode:multiply;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
  .tag{position:absolute;z-index:4;top:30px;inset-inline-start:30px;display:flex;align-items:center;gap:16px;padding:16px 30px 17px 22px;font-size:30px;line-height:1.1}
  html[dir="rtl"] .tag{padding:16px 22px 17px 30px}
  .tag__dot{width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 6px rgba(143,203,90,.25)}
  .tag__sep{width:2px;height:28px;border-radius:2px;background:rgba(255,255,255,.35)}
  .tag__sep:has(+ [hidden]){display:none}
  .tag__price{color:var(--lime)}
  .chips{position:absolute;z-index:4;inset-inline:30px;bottom:30px;display:flex;flex-wrap:wrap;gap:14px}
  .bottom{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
  .headline{flex:1;min-width:0;font-size:100px}
  .act{flex:none;display:flex;flex-direction:column;align-items:center;gap:16px}
  .cta{font-size:34px;padding:24px 42px 25px}
</style>
</head>
<body>
<main class="stage">
  <div class="atmo"></div><div class="grain"></div>
  <header class="top">
    <img class="wordmark audit" src="../../theme/assets/wordmark.svg" alt="LINUX">
    <span class="glass pill eyebrow ui" data-k="eyebrow"></span>
  </header>
  <figure class="card">
    <img class="card__img" data-src="images.drop_photo" alt="">
    <div class="tag glass glass--dark pill ui" data-hide-empty>
      <i class="tag__dot"></i><b data-k="product"></b><i class="tag__sep"></i><span class="tag__price" data-k="price"></span>
    </div>
    <div class="chips" data-list="chips">
      <span class="chip glass glass--dark pill ui" data-item><svg data-icon="sparkle"></svg><span data-f="."></span></span>
    </div>
  </figure>
  <footer class="bottom">
    <h1 class="h headline" data-k="headline" data-fit="2"></h1>
    <div class="act">
      <span class="cta audit"><span data-k="cta"></span><svg class="flip" data-icon="arrow"></svg></span>
      <span class="glass pill site ui ltr" data-k="site"></span>
    </div>
  </footer>
</main>
<script src="kit.js"></script>
</body>
</html>
